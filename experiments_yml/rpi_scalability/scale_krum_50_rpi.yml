# =============================================================
# Scalability Benchmark - RPi Full Fog
# Algorithm: krum | Nodes: 50
# PC IP: 192.168.1.8
# =============================================================
services:
  rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: scale_krum_50_rabbitmq_fog
    ports:
      - "5672:5672"
      - "15672:15672"

  mqtt_fog:
    image: eclipse-mosquitto
    container_name: scale_krum_50_mqtt_fog
    ports:
      - "1883:1883"
    volumes:
      - /home/raspberrypi51/fed-grid-diplo/fog/mosquitto.conf:/mosquitto/config/mosquitto.conf

  fog_app:
    image: fog_node_app:latest
    container_name: scale_krum_50_fog_app
    network_mode: host
    environment:
      - FOG_RABBITMQ_HOST=localhost
      - CLOUD_RABBITMQ_HOST=192.168.1.8
      - CLOUD_RABBITMQ_PORT=5673
      - FOG_MQTT_HOST=localhost
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=192.168.1.8
      - CLOUD_MQTT_PORT=1884
      - FOG_NAME=FOG_NODE_1
      - EDGE_NAMES=edge_node_1,edge_node_2,edge_node_3,edge_node_4,edge_node_5,edge_node_6,edge_node_7,edge_node_8,edge_node_9,edge_node_10,edge_node_11,edge_node_12,edge_node_13,edge_node_14,edge_node_15,edge_node_16,edge_node_17,edge_node_18,edge_node_19,edge_node_20,edge_node_21,edge_node_22,edge_node_23,edge_node_24,edge_node_25,edge_node_26,edge_node_27,edge_node_28,edge_node_29,edge_node_30,edge_node_31,edge_node_32,edge_node_33,edge_node_34,edge_node_35,edge_node_36,edge_node_37,edge_node_38,edge_node_39,edge_node_40,edge_node_41,edge_node_42,edge_node_43,edge_node_44,edge_node_45,edge_node_46,edge_node_47,edge_node_48,edge_node_49,edge_node_50
      - ENCRYPTION_MODE=none
      - AGGREGATION_STRATEGY=krum
      - KRUM_NUM_BYZANTINE=1
      - APP_HOST_PORT=8081
    depends_on:
      - rabbitmq_fog
      - mqtt_fog
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - /home/raspberrypi51/fed-grid-diplo/fog/models:/app/models
      - /home/raspberrypi51/fed-grid-diplo/fog/models/outbox:/app/models/outbox
    restart: on-failure

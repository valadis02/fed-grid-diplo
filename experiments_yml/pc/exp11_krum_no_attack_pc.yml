# =============================================================
# Algorithm : KRUM
# Attack    : no attack
# Attacker% : 0%
# Generated : auto
# =============================================================

networks:
  aqtf_shared_network:
    external: true

services:

  # -- Cloud ----------------------------------------------------------

  cloud_app:
    image: cloud_node_app:latest
    container_name: exp11_cloud_app
    environment:
      - RABBITMQ_HOST=exp11_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp11_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp11_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - APP_HOST_PORT=8081
      - FOG_NAMES=FOG_NODE_1
      - NUM_FOG_NODES=1
    ports:
      - "8082:8081"
    depends_on:
      exp11_rabbitmq_cloud:
        condition: service_healthy
      exp11_mqtt_cloud:
        condition: service_started
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
      - ./data:/app/data:ro
    restart: on-failure

  exp11_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp11_rabbitmq_cloud
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - aqtf_shared_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  exp11_mqtt_cloud:
    image: eclipse-mosquitto
    container_name: exp11_mqtt_cloud
    ports:
      - "1884:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # -- Fog ------------------------------------------------------------

  fog_app:
    image: fog_node_app:latest
    container_name: exp11_fog_app
    environment:
      - RABBITMQ_HOST=exp11_rabbitmq_fog
      - FOG_RABBITMQ_HOST=exp11_rabbitmq_fog
      - FOG_MQTT_HOST=exp11_mqtt_fog
      - FOG_MQTT_PORT=1883
      - CLOUD_RABBITMQ_HOST=exp11_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp11_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - AGGREGATION_STRATEGY=krum
      - KRUM_NUM_BYZANTINE=0
      - MULTI_KRUM_M=0
      - TMEAN_TRIM_FRACTION=0.0
      - FLTRUST_SERVER_NODE=edge_node_1
      - FLTRUST_TS_THRESHOLD=0.05
      - NUM_FOG_NODES=1
    depends_on:
      exp11_rabbitmq_fog:
        condition: service_healthy
      exp11_rabbitmq_cloud:
        condition: service_healthy
      exp11_mqtt_fog:
        condition: service_started
    networks:
      - aqtf_shared_network
    command: python3 -m fog.communication.fog_messaging
    volumes:
      - ./fog/models:/app/models
      - ./data/house_1:/app/root_data:ro
    restart: on-failure

  exp11_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp11_rabbitmq_fog
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - aqtf_shared_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  exp11_mqtt_fog:
    image: eclipse-mosquitto
    container_name: exp11_mqtt_fog
    ports:
      - "1883:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./fog/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # -- Edge Nodes -----------------------------------------------------

  edge_node_1:
    image: edge-node:latest
    container_name: exp11_edge_node_1
    environment:
      - FOG_RABBITMQ_HOST=exp11_rabbitmq_fog
      - FOG_MQTT_HOST=exp11_mqtt_fog
      - FOG_MQTT_PORT=1883
      - MAX_ROUNDS=15
      - WAIT_TIMEOUT_SECS=300
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
      - TRAIN_DAYS=20
      - EVAL_DAYS=9
      - EPOCHS=5
      - EDGE_NAME=edge_node_1
    depends_on:
      exp11_rabbitmq_fog:
        condition: service_healthy
    networks: [aqtf_shared_network]
    command: python3 -m edge.model.run_federated_cycle
    volumes:
      - ./data/house_1:/app/edge/data
      - ./edge/models/node_1:/app/edge/models
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3g
    restart: on-failure

  edge_node_2:

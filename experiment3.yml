# =============================================================
# Πείραμα 3: Επίδραση Υπολογιστικών Περιορισμών
# Τρέχει ΜΟΝΟ στον PC — fog + cloud
#
# Εκτέλεση: docker-compose -f experiment3.yml up
#
# Για κάθε συσκευή:
#   1. Τρέξε αυτό το αρχείο στον PC
#   2. Τρέξε experiment3_edge.yml στην εκάστοτε συσκευή
# =============================================================

networks:
  aqtf_shared_network:
    external: true

services:

# =============================================================
# CLOUD
# =============================================================

  cloud_app:
    image: cloud_node_app:latest
    container_name: exp3_cloud_app
    environment:
      - RABBITMQ_HOST=exp3_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp3_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp3_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - APP_HOST_PORT=8081
      - FOG_NAMES=FOG_NODE_1
      - NUM_FOG_NODES=1
    ports:
      - "8082:8081"
    depends_on:
      - exp3_rabbitmq_cloud
      - exp3_mqtt_cloud
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
      - ./data:/app/data:ro
    restart: on-failure

  exp3_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp3_rabbitmq_cloud
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - aqtf_shared_network

  exp3_mqtt_cloud:
    image: eclipse-mosquitto
    container_name: exp3_mqtt_cloud
    ports:
      - "1884:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

# =============================================================
# FOG
# =============================================================

  fog_app:
    image: fog_node_app:latest
    container_name: exp3_fog_app
    environment:
      - RABBITMQ_HOST=exp3_rabbitmq_fog
      - FOG_HOST=exp3_rabbitmq_fog
      - FOG_RABBITMQ_HOST=exp3_rabbitmq_fog
      - CLOUD_HOST=exp3_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp3_rabbitmq_cloud
      - FOG_MQTT_HOST=exp3_mqtt_fog
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=exp3_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - FOG_NAME=FOG_NODE_1
      # Ένας μόνο edge node κάθε φορά
      - EDGE_NAMES=edge_node_1
      - APP_HOST_PORT=8081
    ports:
      - "8084:8081"
    depends_on:
      - exp3_rabbitmq_fog
      - exp3_mqtt_fog
      - exp3_rabbitmq_cloud
    networks:
      - aqtf_shared_network
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - ./fog/models:/app/models
      - ./fog/models/outbox:/app/models/outbox
    restart: on-failure

  exp3_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp3_rabbitmq_fog
    ports:
      # Εκτίθεται εκτός Docker ώστε τα RPi να συνδέονται από το δίκτυο
      - "5672:5672"
      - "15672:15672"
    networks:
      - aqtf_shared_network

  exp3_mqtt_fog:
    image: eclipse-mosquitto
    container_name: exp3_mqtt_fog
    ports:
      - "1883:1883"
    networks:
      - aqtf_shared_network
# =============================================================
# Πείραμα 4.2: CKKS Ομομορφική Κρυπτογράφηση — RPi Side
# Τρέχει στο RPi — fog app μόνο (aggregation)
# Brokers + Cloud + Edges τρέχουν στον PC (exp4_ckks_pc.yml)
# PC IP: 192.168.1.12
#
# Αλλαγή παραμέτρου ασφάλειας:
#   CKKS_POLY_MOD=8192  → baseline (default)
#   CKKS_POLY_MOD=16384 → υψηλότερη ασφάλεια
#   CKKS_POLY_MOD=32768 → μέγιστη ασφάλεια
#
# Εκτέλεση:
#   1. PC  → docker-compose -f exp4_ckks_pc.yml up
#   2. RPi → CKKS_POLY_MOD=8192 docker compose -f exp4_ckks_rpi.yml up
# =============================================================

networks:
  aqtf_shared_network:
    external: true

services:

  fog_app:
    image: fog_node_app:arm64
    container_name: exp4_ckks_fog_app
    environment:
      - FOG_RABBITMQ_HOST=192.168.1.12
      - CLOUD_RABBITMQ_HOST=192.168.1.12
      - FOG_MQTT_HOST=192.168.1.12
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=192.168.1.12
      - CLOUD_MQTT_PORT=1884
      - FOG_NAME=FOG_NODE_1
      - EDGE_NAMES=edge_node_1,edge_node_2,edge_node_3,edge_node_4,edge_node_5,edge_node_6,edge_node_7,edge_node_8,edge_node_9,edge_node_10
      - ENCRYPTION_MODE=ckks
      - CKKS_POLY_MOD=${CKKS_POLY_MOD:-8192}
    ports:
      - "8084:8081"
    networks:
      - aqtf_shared_network
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - ./fog/models:/app/models
      - ./fog/models/outbox:/app/models/outbox
      - ./shared/ckks_keys:/app/shared/ckks_keys
    restart: on-failure
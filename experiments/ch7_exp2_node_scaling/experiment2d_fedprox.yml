# =============================================================
# Πείραμα 2δ — FedAvg baseline: 5 Edge Nodes, χωρίς resource limits
#
# Εκτέλεση:
#   docker-compose -f experiment2d_fedavg.yml up
# =============================================================

networks:
  aqtf_shared_network:
    external: true

services:

# =============================================================
# CLOUD
# =============================================================

  cloud_app:
    image: cloud_node_app:latest
    container_name: exp2d_cloud_app
    environment:
      - RABBITMQ_HOST=exp2d_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp2d_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp2d_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - APP_HOST_PORT=8081
      - FOG_NAMES=FOG_NODE_1
      - NUM_FOG_NODES=1
    ports:
      - "8112:8081"
    depends_on:
      - exp2d_rabbitmq_cloud
      - exp2d_mqtt_cloud
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
      - ./data:/app/data:ro
    restart: on-failure

  exp2d_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp2d_rabbitmq_cloud
    ports:
      - "5703:5672"
      - "15703:15672"
    networks:
      - aqtf_shared_network

  exp2d_mqtt_cloud:
    image: eclipse-mosquitto
    container_name: exp2d_mqtt_cloud
    ports:
      - "1914:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

# =============================================================
# FOG
# =============================================================

  fog_app:
    image: fog_node_app:latest
    container_name: exp2d_fog_app
    environment:
      - RABBITMQ_HOST=exp2d_rabbitmq_fog
      - FOG_HOST=exp2d_rabbitmq_fog
      - FOG_RABBITMQ_HOST=exp2d_rabbitmq_fog
      - CLOUD_HOST=exp2d_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp2d_rabbitmq_cloud
      - FOG_MQTT_HOST=exp2d_mqtt_fog
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=exp2d_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - FOG_NAME=FOG_NODE_1
      - EDGE_NAMES=edge_node_1,edge_node_2,edge_node_3,edge_node_4,edge_node_5
      - APP_HOST_PORT=8081
      - WAIT_TIMEOUT_SECS=600
    ports:
      - "8114:8081"
    depends_on:
      - exp2d_rabbitmq_fog
      - exp2d_mqtt_fog
      - exp2d_rabbitmq_cloud
    networks:
      - aqtf_shared_network
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - ./fog/models:/app/models
      - ./fog/models/outbox:/app/models/outbox
    restart: on-failure

  exp2d_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp2d_rabbitmq_fog
    ports:
      - "5702:5672"
      - "15702:15672"
    networks:
      - aqtf_shared_network

  exp2d_mqtt_fog:
    image: eclipse-mosquitto
    container_name: exp2d_mqtt_fog
    ports:
      - "1913:1883"
    networks:
      - aqtf_shared_network

# =============================================================
# EDGE NODES (x5) — χωρίς resource limits
# =============================================================

  edge_node_1:
    image: edge-node:latest
    container_name: exp2d_edge_1
    environment:
      - FOG_RABBITMQ_HOST=exp2d_rabbitmq_fog
      - FOG_MQTT_HOST=exp2d_mqtt_fog
      - FOG_MQTT_PORT=1883
      - EDGE_NAME=edge_node_1
      - MAX_ROUNDS=20
      - WAIT_TIMEOUT_SECS=600
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
      - FL_ALGORITHM=fedprox
      - FEDPROX_MU=0.01
    depends_on:
      - exp2d_rabbitmq_fog
      - fog_app
    networks:
      - aqtf_shared_network
    command: python3 -m edge.model.run_federated_cycle
    volumes:
      - ./data/house_1:/app/edge/data
      - ./edge/models/node_1:/app/edge/models
    restart: on-failure

  edge_node_2:

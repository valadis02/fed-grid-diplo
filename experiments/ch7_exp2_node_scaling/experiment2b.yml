# =============================================================
# Πείραμα 2β: Federated Learning με 5 Edge Nodes (RPi5 limits)
# Εκτέλεση: docker-compose -f experiment2b_5nodes.yml up
# Σημ: Ίδια διάταξη με Πείραμα 1, νέα ονόματα containers
# =============================================================

networks:
  aqtf_shared_network:
    external: true

# =============================================================
# CLOUD
# =============================================================
services:

  cloud_app:
    image: cloud_node_app:latest
    container_name: exp2b_cloud_app
    environment:
      - RABBITMQ_HOST=exp2b_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp2b_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp2b_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - APP_HOST_PORT=8081
      - FOG_NAMES=FOG_NODE_1
      - NUM_FOG_NODES=1
    ports:
      - "8102:8081"
    depends_on:
      - exp2b_rabbitmq_cloud
      - exp2b_mqtt_cloud
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
      - ./data:/app/data:ro
    restart: on-failure

  exp2b_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp2b_rabbitmq_cloud
    ports:
      - "5693:5672"
      - "15693:15672"
    networks:
      - aqtf_shared_network

  exp2b_mqtt_cloud:
    image: eclipse-mosquitto
    container_name: exp2b_mqtt_cloud
    ports:
      - "1904:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

# =============================================================
# FOG
# =============================================================

  fog_app:
    image: fog_node_app:latest
    container_name: exp2b_fog_app
    environment:
      - RABBITMQ_HOST=exp2b_rabbitmq_fog
      - FOG_HOST=exp2b_rabbitmq_fog
      - FOG_RABBITMQ_HOST=exp2b_rabbitmq_fog
      - CLOUD_HOST=exp2b_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp2b_rabbitmq_cloud
      - FOG_MQTT_HOST=exp2b_mqtt_fog
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=exp2b_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - FOG_NAME=FOG_NODE_1
      - EDGE_NAMES=edge_node_1,edge_node_2,edge_node_3,edge_node_4,edge_node_5
      - APP_HOST_PORT=8081
    ports:
      - "8104:8081"
    depends_on:
      - exp2b_rabbitmq_fog
      - exp2b_mqtt_fog
      - exp2b_rabbitmq_cloud
    networks:
      - aqtf_shared_network
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - ./fog/models:/app/models
      - ./fog/models/outbox:/app/models/outbox
    restart: on-failure

  exp2b_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp2b_rabbitmq_fog
    ports:
      - "5692:5672"
      - "15692:15672"
    networks:
      - aqtf_shared_network

  exp2b_mqtt_fog:
    image: eclipse-mosquitto
    container_name: exp2b_mqtt_fog
    ports:
      - "1903:1883"
    networks:
      - aqtf_shared_network

# =============================================================
# EDGE NODES (x5) — RPi5 resource limits
# =============================================================

  edge_node_1:
    image: edge-node:latest
    container_name: exp2b_edge_1
    environment:
      - FOG_RABBITMQ_HOST=exp2b_rabbitmq_fog
      - FOG_MQTT_HOST=exp2b_mqtt_fog
      - FOG_MQTT_PORT=1883
      - EDGE_NAME=edge_node_1
      - MAX_ROUNDS=10
      - WAIT_TIMEOUT_SECS=300
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
    depends_on:
      - exp2b_rabbitmq_fog
      - fog_app
    networks:
      - aqtf_shared_network
    command: python3 -m edge.model.run_federated_cycle
    volumes:
      - ./data/house_1:/app/edge/data
      - ./edge/models/node_1:/app/edge/models
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
    restart: on-failure


# =============================================================
# Πείραμα 10 Nodes: PC side
# Τρέχει στον PC — cloud + brokers + 10 edges
# Το fog τρέχει στο RPi (experiment10nodes_synthetic_rpi.yml)
# RPi IP: 192.168.1.25
# =============================================================

networks:
  aqtf_shared_network:
    external: true

services:

  # ── Cloud ────────────────────────────────────────────────────────────────

  cloud_app:
    image: cloud_node_app:latest
    container_name: exp10_cloud_app
    environment:
      - RABBITMQ_HOST=exp10_rabbitmq_cloud
      - CLOUD_RABBITMQ_HOST=exp10_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp10_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - APP_HOST_PORT=8081
      - FOG_NAMES=FOG_NODE_1
      - NUM_FOG_NODES=1
    ports:
      - "8082:8081"
    depends_on:
      - exp10_rabbitmq_cloud
      - exp10_mqtt_cloud
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
      - ./data:/app/data:ro
    restart: on-failure

  exp10_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp10_rabbitmq_cloud
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - aqtf_shared_network

  exp10_mqtt_cloud:
    image: eclipse-mosquitto
    container_name: exp10_mqtt_cloud
    ports:
      - "1884:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── Fog Brokers (RabbitMQ + MQTT για το fog που τρέχει στο RPi) ──────────

  exp10_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp10_rabbitmq_fog
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - aqtf_shared_network

  exp10_mqtt_fog:
    image: eclipse-mosquitto
    container_name: exp10_mqtt_fog
    ports:
      - "1883:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./fog/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── Edge Nodes ────────────────────────────────────────────────────────────

  edge_node_1:
    image: edge-node:latest
    container_name: exp10_edge_1
    environment:
      - FOG_RABBITMQ_HOST=exp10_rabbitmq_fog
      - FOG_MQTT_HOST=exp10_mqtt_fog
      - FOG_MQTT_PORT=1883
      - EDGE_NAME=edge_node_1
      - MAX_ROUNDS=10
      - WAIT_TIMEOUT_SECS=300
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
      - TRAIN_DAYS=2
      - EVAL_DAYS=2
      - EPOCHS=40
    depends_on: [exp10_rabbitmq_fog]
    networks: [aqtf_shared_network]
    command: python3 -m edge.model.run_federated_cycle
    volumes:
      - ./data/house_1:/app/edge/data
      - ./edge/models/node_1:/app/edge/models
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3g
    restart: on-failure

  edge_node_2:
    image: edge-node:latest
    container_name: exp10_edge_2
    environment:

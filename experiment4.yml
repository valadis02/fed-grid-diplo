# experiment4.yml
# Πείραμα 4: Επίδραση AES-256-GCM κρυπτογράφησης στην απόδοση
# Βασισμένο στο experiment3.yml + AES env vars

networks:
  aqtf_shared_network:
    external: true

services:

  # ─── Cloud ─────────────────────────────────────────────────────────────────

  exp4_cloud_app:
    image: cloud_node_app:latest
    container_name: exp4_cloud_app
    environment:
      - CLOUD_RABBITMQ_HOST=exp4_rabbitmq_cloud
      - CLOUD_MQTT_HOST=exp4_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - FALLBACK_FOG_NAMES=FOG_NODE_1
      - AES_ENCRYPTION_KEY=7rcGr04QSt1yZklZptDoZUxHhrwDgECoIl0CxbdXarw=
    ports:
      - "8092:8081"
    depends_on:
      - exp4_rabbitmq_cloud
      - exp4_mqtt_cloud
    networks:
      - aqtf_shared_network
    command: python3 -m cloud.communication.cloud_messaging
    volumes:
      - ./cloud/models:/app/models
      - ./cloud/status:/app/status
    restart: on-failure

  exp4_rabbitmq_cloud:
    image: rabbitmq:3-management
    container_name: exp4_rabbitmq_cloud
    ports:
      - "5675:5672"
      - "15675:15672"
    networks:
      - aqtf_shared_network

  exp4_mqtt_cloud:
    image: eclipse-mosquitto:latest
    container_name: exp4_mqtt_cloud
    ports:
      - "1886:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ─── Fog ───────────────────────────────────────────────────────────────────

  exp4_fog_app:
    image: fog_node_app:latest
    container_name: exp4_fog_app
    environment:
      - FOG_RABBITMQ_HOST=exp4_rabbitmq_fog
      - CLOUD_RABBITMQ_HOST=exp4_rabbitmq_cloud
      - FOG_MQTT_HOST=exp4_mqtt_fog
      - FOG_MQTT_PORT=1883
      - CLOUD_MQTT_HOST=exp4_mqtt_cloud
      - CLOUD_MQTT_PORT=1883
      - FOG_NAME=FOG_NODE_1
      - EDGE_NAMES=edge_node_1
      - AES_ENCRYPTION_KEY=7rcGr04QSt1yZklZptDoZUxHhrwDgECoIl0CxbdXarw=
    ports:
      - "8094:8081"
    depends_on:
      - exp4_rabbitmq_fog
      - exp4_mqtt_fog
      - exp4_rabbitmq_cloud
    networks:
      - aqtf_shared_network
    command: uvicorn fog.communication.app_factory:app --host 0.0.0.0 --port 8081
    volumes:
      - ./fog/models:/app/models
      - ./fog/models/outbox:/app/models/outbox
    restart: on-failure

  exp4_rabbitmq_fog:
    image: rabbitmq:3-management
    container_name: exp4_rabbitmq_fog
    ports:
      - "5674:5672"
      - "15674:15672"
    networks:
      - aqtf_shared_network

  exp4_mqtt_fog:
    image: eclipse-mosquitto:latest
    container_name: exp4_mqtt_fog
    ports:
      - "1885:1883"
    networks:
      - aqtf_shared_network
    volumes:
      - ./fog/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ─── Edge ──────────────────────────────────────────────────────────────────

  exp4_edge_node_1:
    image: edge-node:latest
    container_name: exp4_edge_node_1
    environment:
      - FOG_RABBITMQ_HOST=exp4_rabbitmq_fog
      - FOG_MQTT_HOST=exp4_mqtt_fog
      - FOG_MQTT_PORT=1883
      - EDGE_NAME=edge_node_1
      - MAX_ROUNDS=10
      - WAIT_TIMEOUT_SECS=600
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
      - DEVICE_LABEL=PC
      - AES_ENCRYPTION_KEY=7rcGr04QSt1yZklZptDoZUxHhrwDgECoIl0CxbdXarw=
    command: python3 -m edge.model.run_federated_cycle
    depends_on:
      - exp4_rabbitmq_fog
      - exp4_mqtt_fog
      - exp4_fog_app
    networks:
      - aqtf_shared_network
    volumes:
      - ./data/house_1:/app/edge/data
      - ./edge/models:/app/edge/models
    restart: on-failure